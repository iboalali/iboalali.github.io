# Action to build site with Eleventy and deploy to GitHub pages
# Based on: https://dev.to/davorg/deploying-github-pages-site-with-github-workflows-3bhh

name: Eleventy Build
on:
  push:
    branches:
      - main
  #workflow_dispatch:
  #schedule:
    # Runs at 00:00 UTC every day
  #  - cron: '0 0 * * *'

# Only one Pages deployment at a time. Overlapping deployments to the
# github-pages environment can collide and surface as the Pages backend's
# generic "Deployment failed, try again later." Queue instead of cancelling so
# an in-progress deploy is never left half-applied.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm install

    - name: Build site
      run: npx @11ty/eleventy

    - name: Update pages artifact
      uses: actions/upload-pages-artifact@v3.0.1
      with:
        path: _site/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4